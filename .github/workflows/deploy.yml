name: Python Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-lastest

    steps:
      - name: Checkout code
        uses: actions/Checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
        python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requierements.txt

      - name: Run test with pytest
        run: pytest
